<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VM Duration Forecaster</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }
    h1 { color: #333; }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
    }
    input[type="range"] {
      width: 100%;
    }
    .value-display {
      color: #666;
      font-size: 0.9rem;
    }
    select, input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      background: #4a90e2;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      margin-top: 16px;
    }
    button:hover { background: #357abd; }
    button:disabled { background: #aaa; }
    .result-card {
      background: white;
      border-radius: 8px;
      padding: 24px;
      margin-top: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: none;
    }
    .duration {
      font-size: 3rem;
      font-weight: bold;
      color: #4a90e2;
      text-align: center;
    }
    .duration-label {
      text-align: center;
      color: #666;
      margin-bottom: 16px;
    }
    .savings {
      background: #e8f5e9;
      border-radius: 6px;
      padding: 12px;
      margin: 16px 0;
      color: #2e7d32;
      text-align: center;
    }
    .explanation {
      background: #f9f9f9;
      border-left: 4px solid #4a90e2;
      padding: 16px;
      margin-top: 16px;
      line-height: 1.6;
    }
    .loading {
      text-align: center;
      color: #666;
      display: none;
      margin-top: 16px;
    }
  </style>
</head>



<body>
  <h1>⚡ VM Duration Forecaster</h1>
  <p>Predict VM job duration using 112,552 real Microsoft Azure jobs.</p>

  <!-- Form -->
  <div class="form-group">
    <label>Submission Time (hour of day): 
      <span class="value-display" id="hour_val">10</span>:00
    </label>
    <input type="range" id="hour" min="0" max="23" value="10"
           oninput="document.getElementById('hour_val').textContent=this.value">
  </div>

  <div class="form-group">
    <label>Day of Week</label>
    <select id="day">
      <option value="0">Monday</option>
      <option value="1">Tuesday</option>
      <option value="2">Wednesday</option>
      <option value="3">Thursday</option>
      <option value="4">Friday</option>
      <option value="5">Saturday</option>
      <option value="6">Sunday</option>
    </select>
  </div>

  <div class="form-group">
    <label>CPU Cores (normalized): 
      <span class="value-display" id="core_val">0.08</span>
    </label>
    <input type="range" id="core" min="0" max="100" value="8"
           oninput="document.getElementById('core_val').textContent=(this.value/100).toFixed(2)">
  </div>

  <div class="form-group">
    <label>Memory (normalized): 
      <span class="value-display" id="memory_val">0.08</span>
    </label>
    <input type="range" id="memory" min="0" max="100" value="8"
           oninput="document.getElementById('memory_val').textContent=(this.value/100).toFixed(2)">
  </div>

  <div class="form-group">
    <label>SSD (normalized): 
      <span class="value-display" id="ssd_val">0.06</span>
    </label>
    <input type="range" id="ssd" min="0" max="100" value="6"
           oninput="document.getElementById('ssd_val').textContent=(this.value/100).toFixed(2)">
  </div>

  <div class="form-group">
    <label>NIC (normalized): 
      <span class="value-display" id="nic_val">0.10</span>
    </label>
    <input type="range" id="nic" min="0" max="100" value="10"
           oninput="document.getElementById('nic_val').textContent=(this.value/100).toFixed(2)">
  </div>

  <div class="form-group">
    <label>Priority</label>
    <select id="priority">
      <option value="0">Low (0)</option>
      <option value="1">High (1)</option>
    </select>
  </div>

  <button onclick="predict()" id="predictBtn">Predict Duration</button>

  <div class="loading" id="loading">
    ⏳ Running model and generating explanation...
  </div>

  <!-- Results -->
  <div class="result-card" id="resultCard">
    <div class="duration" id="durationNum">--</div>
    <div class="duration-label">minutes predicted</div>
    <div class="savings" id="savingsDiv"></div>
    <div class="explanation" id="explanationDiv"></div>
  </div>

  <script>
  async function predict() {
    // Convert slider values to normalized (0-1)
    const hour = parseInt(document.getElementById('hour').value);
    const day  = parseInt(document.getElementById('day').value);

    // starttime: combine day and hour into days unit
    const starttime = day + (hour / 24);

    const payload = {
      starttime: starttime,
      core:     parseInt(document.getElementById('core').value) / 100,
      memory:   parseInt(document.getElementById('memory').value) / 100,
      ssd:      parseInt(document.getElementById('ssd').value) / 100,
      nic:      parseInt(document.getElementById('nic').value) / 100,
      priority: parseInt(document.getElementById('priority').value)
    };

    // Show loading, hide results
    const btn = document.getElementById('predictBtn');
    btn.disabled = true;
    btn.textContent = 'Predicting...';
    document.getElementById('loading').style.display = 'block';
    document.getElementById('resultCard').style.display = 'none';

    try {
      const response = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      // Display duration
      document.getElementById('durationNum').textContent =
        data.predicted_duration;

      // Display savings
      const savings = data.savings;
      const savingsDiv = document.getElementById('savingsDiv');
      if (savings > 2) {
        savingsDiv.textContent =
          `💡 Submit at 3am to save ~${savings} minutes`;
        savingsDiv.style.background = '#e8f5e9';
        savingsDiv.style.color = '#2e7d32';
      } else {
        savingsDiv.textContent =
          '✅ Off-peak hours offer no significant savings for this job';
        savingsDiv.style.background = '#e8f5e9';
        savingsDiv.style.color = '#2e7d32';
      }
      savingsDiv.style.display = 'block';

      // Display explanation
      document.getElementById('explanationDiv').textContent =
        data.explanation;

      // Show result card
      document.getElementById('resultCard').style.display = 'block';

    } catch (error) {
      alert('Error: ' + error.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Predict Duration';
      document.getElementById('loading').style.display = 'none';
    }
  }
</script>

</body>
